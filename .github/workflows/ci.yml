name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.38
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Dependências do gerador (compatibilidade da criptografia)
        working-directory: .
        run: bun install --frozen-lockfile
      - name: Dependências do portal
        run: bun install --frozen-lockfile
      - name: Testes unitários
        run: bun run test
      - name: Testes das regras do Firestore (emulador)
        run: |
          npm install -g firebase-tools@13.29.1
          firebase emulators:exec --only firestore --project demo-eventos-hub "npx vitest run tests/rules"
      - name: Build
        run: bun run build
